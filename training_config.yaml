# PVZ AI Baseline Training Configuration
# Dense reward: zombie HP reduction per step (zombie_damage).
# MLP architecture: 596 → 2048 → 2048 → 451.
#
# This is the primary baseline. All baseline_* variants share the same reward
# and differ only in network architecture.
#
# Usage:
#   .\.venv\Scripts\python.exe train.py --training_config training_config.yaml

# =============================================================================
# Game Settings — Survival: Day  (same as baseline)
# =============================================================================
game:
  game_mode_id: 6                # GAMEMODE_SURVIVAL_HARD_DAY = 生存白天(困难)
  rows: 5                        # 5 rows
  cols: 9                        # 9 columns
  initial_sun: 50

# =============================================================================
# Card Loadout — exactly matching paper Table 4  (same as baseline)
# =============================================================================
cards:
  slot_count: 10

  plants:
    # Slot 0: Sunflower (economy)
    - slot: 0
      id: 1
      name: "Sunflower"
      cost: 50

    # Slot 1: Peashooter (basic offense)
    - slot: 1
      id: 0
      name: "Peashooter"
      cost: 100

    # Slot 2: Potato Mine (trap)
    - slot: 2
      id: 4
      name: "Potato Mine"
      cost: 25

    # Slot 3: Wall-nut (defense)
    - slot: 3
      id: 3
      name: "Wall-nut"
      cost: 50

    # Slot 4: Repeater (double damage)
    - slot: 4
      id: 7
      name: "Repeater"
      cost: 200

    # Slot 5: Squash (instant kill)
    - slot: 5
      id: 17
      name: "Squash"
      cost: 50

    # Slot 6: Cherry Bomb (AOE instant)
    - slot: 6
      id: 2
      name: "Cherry Bomb"
      cost: 150

    # Slot 7: Snow Pea (slow)
    - slot: 7
      id: 5
      name: "Snow Pea"
      cost: 175

    # Slot 8: Melon-pult (AOE damage)
    - slot: 8
      id: 39
      name: "Melon-pult"
      cost: 300

    # Slot 9: Spikeweed (ground trap)
    - slot: 9
      id: 21
      name: "Spikeweed"
      cost: 100

# =============================================================================
# Action Space — 10 cards × 5 rows × 9 cols + 1 wait = 451  (same as baseline)
# =============================================================================
action_space:
  size: 451

  structure:
    plant_actions: 450          # 10 cards × 45 cells
    shovel_actions: 0           # disabled
    wait_action: 1

# =============================================================================
# Observation Space — Paper-format 596-dim flat vector
#
# DDQN adapter (ddqn_paper_observation=true) extracts from 13-ch grid:
#   sun count           :  1 dim
#   card cooldowns      : 10 dim
#   plant type one-hot  : 5×9×(10+1) = 495 dim  (card-slot one-hot, not plant-id)
#   plant HP grid       : 5×9 = 45 dim
#   zombie HP grid      : 5×9 = 45 dim
#   ─────────────────────────────────────────────
#   Total               : 596 dim
#
# Grid shape & global total_dim kept for PVZEnv Dict obs init (PPO compat).
# global_features & card_attributes are ignored by DDQN paper adapter.
# =============================================================================
observation_space:
  grid:
    shape: [5, 9, 13]           # 5 rows × 9 cols × 13 channels

  global:
    total_dim: 61               # actual dims filled by _build_global_features()

  card_attributes:
    shape: [10, 7]

# =============================================================================
# Reward — hardcoded zombie_damage (zombie HP reduction per step).
#
# All auxiliary rewards are disabled because rewards.use_shaped is not set.
# These 4 keys are read directly in step() and default to non-zero — force to 0.
# =============================================================================
rewards:
  reward_scale: 1              # reward scale
  plant_lost_sun_cost_scale: 0.0  # 丢失植物按阳光成本惩罚（0=禁用, 1=全额阳光）
  invalid_action: 0.0          # default -0.01
  wait_with_sun: 0.0           # default -0.02
  game_win: 0.0                # default +3.0
  game_lose: 0.0               # default -3.0

# =============================================================================
# Training Configuration  (same as baseline except batch/buffer/frameskip)
# =============================================================================
training:
  args:
    algo: "ddqn"
    port: 12345
    num_envs: 1
    base_port: 12345
    ports: ""
    pids: ""
    auto_start: true
    launch_toolkit: false         # PvZ Toolkit 默认不启动
    game_path: "gameobj/PlantsVsZombies.exe"
    wait_time: 3.0
    speed: 10.0
    frameskip: 49               # DEBUG: 1 step ≈ 1 sec game time (baseline: 24)
    auto_resume: false
    env_console_log_level: 0
    file_log_level: 1
    execution: "async_worker_pool"
    curriculum: "none"

  ddqn:
    ddqn_episodes: 10000        # same as baseline
    ddqn_gamma: 0.99            # same as baseline
    ddqn_batch_size: 512        # DEBUG: larger batch (baseline: 32)
    ddqn_buffer_size: 100000    # DEBUG: larger buffer (baseline: 50000)
    ddqn_burn_in: 10000         # same as baseline
    ddqn_lr: 0.0001              # same as baseline
    ddqn_update_freq: 32
    ddqn_sync_freq: 2000        # same as baseline
    ddqn_checkpoint_freq: 500
    ddqn_plot_freq: 50
    ddqn_plot_path: null
    ddqn_save_path: null
    ddqn_load_path: null

    # Paper network architecture: 2 hidden layers of 2048 each  (same as baseline)
    ddqn_hidden_sizes: [2048, 2048]
    use_dueling: false             # Dueling DQN 架构 (Wang et al., 2016)

  env:
    max_steps: 10000
